name: Validate

on:
  pull_request:
    branches: [main]

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR merge commit's first parent is the tested main revision.
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.18'
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - run: pnpm python:sync --locked
      - name: Run Standard validation
        run: pnpm validate:standard HEAD^1
