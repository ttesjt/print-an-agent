[project]
name = "ta-agent-model-workbench-python"
version = "0.1.0"
description = "Python workspace for Modular Agent Model Workbench components."
requires-python = ">=3.11,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]
exclude = ["packages/.gitkeep"]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["template/src"]
testpaths = ["template/tests", "packages"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages", "template/src"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["template/src", "template/tests"]
strict = true
warn_unreachable = true
