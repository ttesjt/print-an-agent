[project]
name = "ta-agent-model-backend-scaffold"
version = "0.1.0"
description = "Repository-local scaffolder for Workbench-compatible Python model backends."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.scripts]
model-backend-scaffold = "ta_agent_model_backend_scaffold.cli:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
